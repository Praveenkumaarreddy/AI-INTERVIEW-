       <script>
    // --- CONFIGURATION ---
    const BACKEND_URL = 'https://ai-interview-5kvb.onrender.com'; 
    
    let stream = null;
    let recognition = null;
    let isRecording = false;
    let timerInterval = null;
    let seconds = 0;
    let currentQuestion = 1;
    const totalQuestions = 5;

    // Score Tracking Variables
    let scoreData = { confidence: [], tech: [], comm: [] };

    // Initialize Camera
    async function initCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            document.getElementById('webcam-preview').srcObject = stream;
            document.getElementById('webcam-live').srcObject = stream;
        } catch (err) {
            console.error("Camera error:", err);
            alert("Please allow camera and microphone access.");
        }
    }

    // Screen Navigation
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(screenId).style.display = 'flex';
    }

    // Start Interview Flow
    function startInterview() {
        showScreen('screen-interview');
        updateProgress();
        setTimeout(() => {
            const q = "Hello! I'm so glad you're here. To begin, could you please introduce yourself and share a bit about your teaching philosophy?";
            addChatBubble('ai', q);
            speakText(q);
            startTimer();
        }, 1000);
    }

    function startTimer() {
        clearInterval(timerInterval);
        seconds = 0;
        document.getElementById('timer-display').innerText = "00:00";
        timerInterval = setInterval(() => {
            seconds++;
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function updateProgress() {
        document.getElementById('progress-text').innerText = `Question ${currentQuestion} of ${totalQuestions}`;
    }

    function addChatBubble(sender, text) {
        const chatBox = document.getElementById('chat-box');
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender === 'ai' ? 'ai-bubble' : 'user-bubble'}`;
        bubble.innerText = text;
        chatBox.appendChild(bubble);
        chatBox.scrollTop = chatBox.scrollHeight;
        return bubble;
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            // Clean up the text so it doesn't read out the score formatting
            let cleanText = text.replace(/Scores.*/g, '').replace('Feedback:', '').replace('Next Question:', '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            window.speechSynthesis.speak(utterance);
        }
    }

    // ROBUST SPEECH RECOGNITION SETUP
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        
        let currentTranscriptionBubble = null;
        let finalTranscript = "";

        recognition.onstart = () => {
            isRecording = true;
            document.getElementById('mic-btn').innerText = "⏹ Stop & Submit Answer";
            document.getElementById('mic-btn').classList.replace('btn-blue', 'btn-red');
            currentTranscriptionBubble = addChatBubble('user', 'Listening...');
            finalTranscript = "";
        };

        recognition.onresult = (event) => {
            let interimTranscript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcriptPiece = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcriptPiece + " ";
                } else {
                    interimTranscript += transcriptPiece;
                }
            }
            if (currentTranscriptionBubble) {
                currentTranscriptionBubble.innerText = finalTranscript + interimTranscript;
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech Rec Error:", event.error);
        };
    }

    async function toggleRecording() {
        if (!recognition) return alert("Speech recognition not supported. Please use Chrome.");
        
        if (!isRecording) {
            try {
                recognition.start();
            } catch (e) {
                console.log("Mic already started");
            }
        } else {
            isRecording = false;
            recognition.stop();
            document.getElementById('mic-btn').innerText = "Analyzing...";
            document.getElementById('mic-btn').classList.replace('btn-red', 'btn-blue');
            document.getElementById('mic-btn').disabled = true;
            
            const userText = document.querySelectorAll('.user-bubble');
            let latestAnswer = userText[userText.length - 1].innerText;
            
            // Fallback if mic failed to pick up words
            if (latestAnswer === 'Listening...' || latestAnswer.trim() === '') {
                latestAnswer = "[User attempted to speak but no audio was detected. Please ask them to try again nicely.]";
            }
            
            addChatBubble('ai', 'Thinking...');
            await fetchFeedback(latestAnswer);
        }
    }

    async function fetchFeedback(transcript) {
        try {
            const response = await fetch(`${BACKEND_URL}/interview`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transcript: transcript })
            });
            
            const data = await response.json();
            const chatBox = document.getElementById('chat-box');
            chatBox.removeChild(chatBox.lastChild); // Remove "Thinking..."

            if (response.ok) {
                const aiResponse = data.response;
                addChatBubble('ai', aiResponse);
                speakText(aiResponse);
                
                // Extract dynamic scores using Regex
                const confMatch = aiResponse.match(/Confidence:\s*(\d+)/i);
                const techMatch = aiResponse.match(/Technical:\s*(\d+)/i);
                const commMatch = aiResponse.match(/Communication:\s*(\d+)/i);
                
                if (confMatch) scoreData.confidence.push(parseInt(confMatch[1]));
                if (techMatch) scoreData.tech.push(parseInt(techMatch[1]));
                if (commMatch) scoreData.comm.push(parseInt(commMatch[1]));
                
                currentQuestion++;
                if (currentQuestion > totalQuestions) {
                    setTimeout(endInterview, 8000); 
                } else {
                    updateProgress();
                    startTimer();
                    document.getElementById('mic-btn').disabled = false;
                    document.getElementById('mic-btn').innerText = "🎤 Start Next Answer";
                }
            } else {
                addChatBubble('ai', "Error connecting to server.");
            }
        } catch (err) {
            addChatBubble('ai', "Failed to reach backend.");
        }
        document.getElementById('mic-btn').disabled = false;
    }

    function skipQuestion() {
        addChatBubble('ai', "No problem, let's move on to the next topic.");
        speakText("No problem, let's move on to the next topic.");
        currentQuestion++;
        if (currentQuestion > totalQuestions) endInterview();
        else { updateProgress(); startTimer(); }
    }

    function endInterview() {
        clearInterval(timerInterval);
        showScreen('screen-results');
        
        // Calculate Averages based on real data
        const calcAvg = (arr) => arr.length ? (arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1) : 0;
        
        const avgConf = calcAvg(scoreData.confidence);
        const avgTech = calcAvg(scoreData.tech);
        const avgComm = calcAvg(scoreData.comm);
        const overall = ((parseFloat(avgConf) + parseFloat(avgTech) + parseFloat(avgComm)) / 3).toFixed(1);
        
        document.getElementById('score-overall').innerText = `${overall}/10`;
        document.getElementById('score-confidence').innerText = `${avgConf}/10`;
        document.getElementById('score-comm').innerText = `${avgComm}/10`;
        document.getElementById('score-tech').innerText = `${avgTech}/10`;
        
        document.getElementById('ai-suggestions').innerText = "Great job completing the interview! Review your dynamic scores above based on your actual responses.";
        speakText("Interview complete. Great job! Here is your final evaluation report.");
    }

    window.onload = initCamera;
</script>
